name: Daily Anomaly Refresh (rescore + rebrief)

on:
  schedule:
    # 8am UTC, four hours after the Monday weekly ingest starts. The old
    # 5am slot sat inside the weekly's run window, so every Monday the
    # daily hit the pipeline lock and died at the trigger step. The 409
    # retry below is the belt to this braces.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  daily:
    uses: ./.github/workflows/refresh.yml
    secrets: inherit
    with:
      mode: daily
      # Dominated by up to MAX_FRESH_BRIEFS_PER_RUN (default 60)
      # sequential Anthropic calls; the rest is seconds.
      poll_minutes: 30
      busy_wait_minutes: 60
