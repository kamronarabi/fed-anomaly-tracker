name: Weekly Anomaly Refresh (USAspending incremental ingest)

on:
  schedule:
    - cron: '0 4 * * 1'   # Every Monday at 4am UTC
  workflow_dispatch:

jobs:
  weekly:
    uses: ./.github/workflows/refresh.yml
    secrets: inherit
    with:
      mode: weekly
      # A steady-state incremental window is ~7 days and finishes in
      # minutes. The budget is sized for the outlier instead: a window
      # that has to catch up on months of backlog (recursive day-splits
      # against the API's 10K/day cap, WAF warmups, 90s retry sleeps)
      # measured 58 minutes on 2026-08-24.
      poll_minutes: 90
      # Nothing else should be holding the lock at 4am.
      busy_wait_minutes: 15
